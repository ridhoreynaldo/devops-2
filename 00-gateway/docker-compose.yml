# 00-gateway/docker-compose.yml
services:
  gateway_nginx:
    image: nginx:alpine
    container_name: global_gateway
    restart: unless-stopped
    ports:
      # KUNCI: Kunci port 80 & 443 hanya di IP 90.100
      # - "192.168.90.100:80:80"
      # - "192.168.90.100:443:443"
      - "80:80"
      - "443:443"
      - "1337:1337"
      - "8003:8003"
      - "8069:8069"
      - "8070:8070"
      - "8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./logs:/var/log/nginx
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - global-gateway-net
    # Pertahankan ini untuk perpanjangan SSL otomatis (renew) di background
  certbot:
    image: certbot/certbot
    container_name: certbot_auto_renew
    restart: unless-stopped
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
networks:
  global-gateway-net:
    external: true   # <--- INI KUNCI PERBAIKANNYA