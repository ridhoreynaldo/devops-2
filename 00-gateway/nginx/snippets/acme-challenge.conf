# 00-gateway/nginx/snippets/acme-challenge.conf
# Dipakai oleh Certbot (HTTP-01). WAJIB di-include di setiap server yang
# listen 80, SEBELUM directive "return" — location menang atas return
# di level server.
location ^~ /.well-known/acme-challenge/ {
    default_type "text/plain";
    root /var/www/certbot;
}
