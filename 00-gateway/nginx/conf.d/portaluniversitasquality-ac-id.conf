# 00-gateway/nginx/conf.d/portaluniversitasquality-ac-id.conf
# ==============================================================
# 1. APP 4 (Lokal: 8069 -> Publik: 8012)    (DOSEN)
# ==============================================================
server {
    listen 8069 ssl; # Nginx mendengarkan port dari Mikrotik
    http2 on;
    server_name portaluniversitasquality.ac.id www.portaluniversitasquality.ac.id;

    ssl_certificate /etc/nginx/ssl/portaluniversitasquality-ac-id/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/portaluniversitasquality-ac-id/privkey.pem;

    # Jika HTTP biasa nyasar ke sini, paksa lari ke Port Publik HTTPS
    error_page 497 =301 https://$host:8012$request_uri;

    location / {
        # --- RATE LIMIT ---
        limit_req zone=req_limit_per_ip burst=500 nodelay;
        limit_conn conn_limit_per_ip 300;

        proxy_pass http://web_portaluniversitasquality-ac-id-8069:80; 
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # --- PERINTAH KHUSUS MIKROTIK UNTUK LARAVEL ---
        proxy_set_header X-Forwarded-Port 8012; 
    }
}

