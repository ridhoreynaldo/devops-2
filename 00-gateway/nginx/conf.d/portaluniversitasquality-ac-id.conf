# 00-gateway/nginx/conf.d/portaluniversitasquality-ac-id.conf
# Pola umum tiap server di bawah:
#   - listen <port-lokal> ssl  (port yang di-forward Mikrotik)
#   - error_page 497 -> redirect ke port publik
#   - proxy ke container web internal + header X-Forwarded-Port agar
#     Laravel generate URL dengan port publik yang benar.

# ==============================================================
# 1. APP 4 (Lokal: 8069 -> Publik: 8012) (DOSEN)
# ==============================================================
server {
    listen 8069 ssl;
    http2 on;
    server_name portaluniversitasquality.ac.id www.portaluniversitasquality.ac.id;

    ssl_certificate /etc/nginx/ssl/portaluniversitasquality-ac-id/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/portaluniversitasquality-ac-id/privkey.pem;

    include /etc/nginx/snippets/security-headers.conf;

    # Jika HTTP biasa nyasar ke port SSL, paksa ke port publik HTTPS
    error_page 497 =301 https://$host:8012$request_uri;

    location / {
        limit_req zone=req_limit_per_ip burst=500 nodelay;
        limit_conn conn_limit_per_ip 300;

        include /etc/nginx/snippets/proxy.conf;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Port 8012;

        proxy_pass http://web_portaluniversitasquality-ac-id-8069:80;
    }
}

# ==============================================================
# 1.2. APP 4 (Lokal: 8070 -> Publik: 8010) (SIAKAD)
# ==============================================================
server {
    listen 8070 ssl;
    http2 on;
    server_name portaluniversitasquality.ac.id www.portaluniversitasquality.ac.id;

    ssl_certificate /etc/nginx/ssl/portaluniversitasquality-ac-id/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/portaluniversitasquality-ac-id/privkey.pem;

    include /etc/nginx/snippets/security-headers.conf;

    error_page 497 =301 https://$host:8010$request_uri;

    location / {
        # SIAKAD dibatasi lebih ketat agar tidak mengganggu app lain
        limit_req zone=req_limit_per_ip burst=20 nodelay;
        limit_conn conn_limit_per_ip 50;

        include /etc/nginx/snippets/proxy.conf;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Port 8010;

        proxy_pass http://web_portaluniversitasquality-ac-id-8070:80;
    }
}

# ==============================================================
# 1.3. APP 4 (Lokal: 8003 -> Publik: 8003) (API-MANDIRI)
# ==============================================================
server {
    listen 8003 ssl;
    http2 on;
    server_name portaluniversitasquality.ac.id www.portaluniversitasquality.ac.id;

    ssl_certificate /etc/nginx/ssl/portaluniversitasquality-ac-id/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/portaluniversitasquality-ac-id/privkey.pem;

    include /etc/nginx/snippets/security-headers.conf;

    error_page 497 =301 https://$host:8003$request_uri;

    location / {
        # Burst dilebihkan sedikit karena API menarik banyak data sekaligus
        limit_req zone=req_limit_per_ip burst=500 nodelay;
        limit_conn conn_limit_per_ip 300;

        include /etc/nginx/snippets/proxy.conf;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Port 8003;

        proxy_pass http://web_portaluniversitasquality-ac-id-8003:80;
    }
}

