# ==============================================================
# 4. GABUNGAN 3 APP DI PORT 8443 (Aset Asrama, V2, Khusus)
# ==============================================================
server {
    listen 8443 ssl;
    http2 on;
    server_name portaluniversitasquality.ac.id www.portaluniversitasquality.ac.id;

    ssl_certificate /etc/nginx/ssl/portaluniversitasquality-ac-id/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/portaluniversitasquality-ac-id/privkey.pem;

    # Jika HTTP biasa nyasar ke sini
    error_page 497 =301 https://$host:8443$request_uri;

    # ----------------------------------------------------------
    # 4.1 ASRAMA PUTRI
    # ----------------------------------------------------------
    # Redirect otomatis jika user lupa mengetik garis miring (/) di akhir URL
    location = /asrama-putri { return 301 /asrama-putri/; }
    
    location /asrama-putri/ {
        # --- RATE LIMIT ---
        limit_req zone=req_limit_per_ip burst=500 nodelay;
        limit_conn conn_limit_per_ip 300;

        # Perhatikan trailing slash (/) di belakang port 80!
        proxy_pass http://web_portaluniversitasquality-ac-id-8443-asrama-putri:80/; 
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8443;
    }

    # ----------------------------------------------------------
    # 4.2 ASET MANAJEMEN V2
    # ----------------------------------------------------------
    location = /aset-manajemen-v2 { return 301 /aset-manajemen-v2/; }
    
    location /aset-manajemen-v2/ {
        # --- RATE LIMIT ---
        limit_req zone=req_limit_per_ip burst=500 nodelay;
        limit_conn conn_limit_per_ip 300;

        proxy_pass http://web_portaluniversitasquality-ac-id-8443-aset-manajemen-v2:80/; 
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8443;
    }

    # ----------------------------------------------------------
    # 4.3 ASET MANAJEMEN KHUSUS
    # ----------------------------------------------------------
    location = /aset-manajemen-khusus { return 301 /aset-manajemen-khusus/; }
    
    location /aset-manajemen-khusus/ {
        # --- RATE LIMIT ---
        limit_req zone=req_limit_per_ip burst=500 nodelay;
        limit_conn conn_limit_per_ip 300;

        proxy_pass http://web_portaluniversitasquality-ac-id-8443-aset-manajemen-khusus:80/; 
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8443;
    }

    # ----------------------------------------------------------
    # 4.4 ASET MANAJEMEN
    # ----------------------------------------------------------
    location = /aset-manajemens { return 301 /aset-manajemen/; }
    
    location /aset-manajemen/ {
        # --- RATE LIMIT ---
        limit_req zone=req_limit_per_ip burst=500 nodelay;
        limit_conn conn_limit_per_ip 300;

        proxy_pass http://web_portaluniversitasquality-ac-id-8443-aset-manajemen:80/; 
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8443;
    }
}

# ==============================================================
# 3. REDIRECT HTTP 80 (Otomatis ke App 5 / 1339)
# ==============================================================
server {
    listen 80;
    server_name portaluniversitasquality.ac.id www.portaluniversitasquality.ac.id;
    # return 301 https://$host:1339$request_uri;
    
    # Langsung putus koneksi. Tidak di-redirect ke port mana-pun.
    # Mahasiswa WAJIB mengetik port tujuannya (misal: :8070)
    return 444;
}