# 00-gateway/nginx/conf.d/ridhoreynaldo-com.conf
# HTTP: layani ACME challenge (Let's Encrypt) + redirect permanen ke HTTPS.
server {
    listen 80;
    server_name ridhoreynaldo.com www.ridhoreynaldo.com;

    include /etc/nginx/snippets/acme-challenge.conf;

    return 301 https://$host$request_uri;
}
