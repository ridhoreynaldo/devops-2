# 00-gateway/nginx/conf.d/00-default.conf
# "Tong sampah": tolak semua request yang tidak cocok ke vhost mana pun
# (akses via IP langsung, scanner, dsb).

# ==========================================
# 1. HTTP biasa -> putus koneksi,
#    kecuali ACME challenge untuk Certbot
# ==========================================
server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/snippets/acme-challenge.conf;

    return 444;
}

# ==========================================
# 2. HTTPS -> tolak handshake SSL langsung
# ==========================================
server {
    listen 443 ssl default_server;
    listen 1337 ssl default_server;
    listen 8003 ssl default_server;
    listen 8069 ssl default_server;
    listen 8070 ssl default_server;
    listen 8443 ssl default_server;
    # (Tambahkan listen baru di sini setiap membuka port SSL di docker-compose)

    http2 on;
    server_name _;
    ssl_reject_handshake on;
}
