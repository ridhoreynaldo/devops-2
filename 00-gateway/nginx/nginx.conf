# 00-gateway/nginx/nginx.conf
user nginx;
worker_processes auto; # Gunakan semua core CPU
pid /var/run/nginx.pid;
worker_rlimit_nofile 65535; # Limit file descriptor tinggi

events {
    worker_connections 4096;
    multi_accept on;
    use epoll; # Efisien untuk Linux
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression (Bikin load file text/json/css melesat)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6; # Sweet spot antara CPU usage & kompresi
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Global SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m; # Cache SSL agar tidak hitung ulang per koneksi (Hemat CPU)
    ssl_session_tickets off;

    # ==============================================================
    # PENGATURAN RATE LIMITING (ZONE DEFINITION)
    # ==============================================================
    # 1. Batasi Request: Max 10 request per detik per IP
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=10r/s;
    
    # 2. Zone KHUSUS SIAKAD 8070 (Biar nggak bawa sial ke project lain)
    limit_req_zone $binary_remote_addr zone=req_limit_8003:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=req_limit_8070:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=req_limit_8069:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=req_limit_8443:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=req_limit_1337:10m rate=10r/s;

    # 2. Batasi Koneksi Aktif: Max 20 koneksi bersamaan per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    
    # 3. Ubah status error dari 503 menjadi 429 (Too Many Requests)
    limit_req_status 429;
    limit_conn_status 429;
    # ==============================================================

    include /etc/nginx/conf.d/*.conf;
}