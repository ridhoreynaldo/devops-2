# 02-monitoring/docker-compose.yml
#
# Password Grafana diambil dari file .env (jangan hardcode!).
#   cp .env.example .env   -> lalu isi GF password yang kuat

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 1. PORTAINER (Manajemen Container)
  portainer:
    image: portainer/portainer-ce:2.45.1-alpine
    container_name: devops_portainer
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Bind ke localhost saja - akses via reverse proxy / SSH tunnel
      - "${BIND_IP:-127.0.0.1}:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - global-gateway-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # 2. UPTIME KUMA (Monitoring Web Nyala/Mati)
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.5
    container_name: devops_uptime_kuma
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${BIND_IP:-127.0.0.1}:3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
      # docker.sock HANYA jika pakai monitor tipe "Docker Container" (read-only!)
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - global-gateway-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    environment:
      - UPTIME_KUMA_SQLITE_SINGLE_CONNECTION=true # Mencegah lock SQLite

  # 3. CADVISOR (Metrik container)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: devops_cadvisor
    restart: unless-stopped
    logging: *default-logging
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - '--housekeeping_interval=10s'
      - '--docker_only=true'
    networks:
      - global-gateway-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # 4. PROMETHEUS
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: devops_prometheus
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=2GB'   # jaga-jaga biar disk nggak penuh
    depends_on:
      - cadvisor
    networks:
      - global-gateway-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # 5. GRAFANA
  grafana:
    image: grafana/grafana:11.6
    container_name: devops_grafana
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    ports:
      - "${BIND_IP:-127.0.0.1}:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      # Diisi dari file .env, jangan hardcode / jangan biarkan default admin/admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?isi GRAFANA_ADMIN_PASSWORD di file .env}
    depends_on:
      - prometheus
    networks:
      - global-gateway-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # 6. NODE EXPORTER (Metrik host: CPU, RAM, disk, suhu)
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: devops_node_exporter
    restart: unless-stopped
    logging: *default-logging
    pid: host   # best practice resmi node-exporter, bukan celah
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - global-gateway-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.3'

volumes:
  portainer_data:
  uptime_kuma_data:
  prometheus_data:
  grafana_data:

networks:
  global-gateway-net:
    external: true
