services:
  # 1. PORTAINER (Manajemen Container)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: devops_portainer
    restart: unless-stopped
    ports:
      # Bind hanya ke localhost - akses via reverse proxy / SSH tunnel, JANGAN expose 0.0.0.0
      # - "127.0.0.1:9000:9000"
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - global-gateway-net
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5

  # 2. UPTIME KUMA (Monitoring Web Nyala/Mati)
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: devops_uptime_kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
      # docker.sock DIHAPUS - hanya perlu jika pakai fitur "Docker Container" monitor.
      # Kalau memang dipakai, uncomment baris di bawah (read-only, bukan read-write):
      # - /var/run/docker.sock:/var/run/docker.sock:ro
      # 👇 Tambahkan baris ini untuk memberikan akses Kunci Master
      - /var/run/docker.sock:/var/run/docker.sock
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - global-gateway-net
    # Jangan Pakai ini
    # extra_hosts:
    #   - "portaluniversitasquality.ac.id:172.29.160.1"
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1
    # 👇 FIX 2: Tambahkan Environment Variable untuk manajemen koneksi kueri
    environment:
      - UPTIME_KUMA_SQLITE_SINGLE_CONNECTION=true # Mencegah tabrakan kueri ganda penyebab lock

  # 3. GRAFANA STACK (Monitoring Performa Server)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: devops_cadvisor
    restart: unless-stopped
    # privileged:true diganti dengan capability spesifik yang cadvisor benar-benar butuhkan
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - '--housekeeping_interval=10s'
      - '--docker_only=true'
    networks:
      - global-gateway-net
    mem_limit: 256m
    cpus: 0.5

  prometheus:
    image: prom/prometheus:latest
    container_name: devops_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=2GB'   # jaga-jaga biar disk nggak penuh
    depends_on:
      - cadvisor
    networks:
      - global-gateway-net
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5

  grafana:
    image: grafana/grafana:latest
    container_name: devops_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      # Set password lewat .env file, jangan hardcode / jangan biarkan default "admin/admin"
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    depends_on:
      - prometheus
    networks:
      - global-gateway-net
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5

  # 4. NODE EXPORTER (Khusus membaca sisa SSD, CPU Server, Suhu, dll)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: devops_node_exporter
    restart: unless-stopped
    pid: host   # perlu tetap ada - ini best practice resmi node-exporter, bukan celah
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - global-gateway-net
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.3

volumes:
  portainer_data:
  uptime_kuma_data:
  prometheus_data:
  grafana_data:

networks:
  global-gateway-net:
    external: true