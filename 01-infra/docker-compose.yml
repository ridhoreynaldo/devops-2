# 01-infra/docker-compose.yml
#
# PENTING: semua password diambil dari file .env (jangan hardcode!).
#   cp .env.example .env   -> lalu isi password yang KUAT & UNIK per service
# File .env sudah masuk .gitignore dan TIDAK BOLEH di-commit.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ==========================================
  # 1. POSTGRESQL
  # ==========================================
  postgres-db:
    image: postgres:16-alpine
    container_name: infra_postgres
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di file .env}
      TZ: Asia/Jakarta
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backup/postgresql:/var/opt/postgresql/backup
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    networks:
      - global-gateway-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '2.0'

  # ==========================================
  # 2. PGBOUNCER
  # ==========================================
  pgbouncer:
    image: pgbouncer/pgbouncer:1.25
    container_name: infra_pgbouncer
    restart: unless-stopped
    # Lewati entrypoint bawaan image (exit 1 bila env DATABASES_HOST/
    # DATABASES tidak di-set, walau pgbouncer.ini sudah di-mount).
    # Jalankan pgbouncer langsung dengan config kita (routing wildcard *).
    entrypoint: ["/opt/pgbouncer/pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
    logging: *default-logging
    volumes:
      - ./postgres/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./postgres/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      # Hanya bisa diakses dari server ini. Aplikasi lain pakai network internal.
      - "${BIND_IP:-127.0.0.1}:5432:5432"
    networks:
      - global-gateway-net
    depends_on:
      postgres-db:
        condition: service_healthy
    # Catatan: tidak ada healthcheck di sini — pgbouncer otomatis
    # menyambung ulang ke postgres saat backend sudah siap.
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ==========================================
  # 3. SQL SERVER
  # ==========================================
  sqlserver-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: infra_sqlserver
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?isi MSSQL_SA_PASSWORD di file .env}
      MSSQL_PID: "Express"
      TZ: Asia/Jakarta
    ports:
      # Hanya bisa diakses dari server ini, JANGAN expose 0.0.0.0
      - "${BIND_IP:-127.0.0.1}:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./backup/sqlserver:/var/opt/mssql/backup
      - ./sqlserver/mssql.conf:/var/opt/mssql/mssql.conf:ro
    networks:
      - global-gateway-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' -C -b -o /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  # ==========================================
  # 4. REDIS CACHE
  # ==========================================
  redis-cache:
    image: redis:7-alpine
    container_name: infra_redis
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    # Password dibaca dari env di dalam container (tidak kelihatan di docker inspect)
    command: >
      sh -c 'exec redis-server
      --requirepass "$${REDIS_PASSWORD:?isi REDIS_PASSWORD di file .env}"
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru'
    volumes:
      - redis-data:/data
    networks:
      - global-gateway-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

volumes:
  postgres-data:
  sqlserver-data:
  redis-data:

networks:
  global-gateway-net:
    external: true
